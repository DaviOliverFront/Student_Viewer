<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Viewer - Visualizando o futuro da educação!</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css ">
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <main class="container d-flex justify-content-left align-items-center vh-100">
        <div class="card p-4 shadow login">
            <img src="android-chrome-192x192.png" alt="image" class="d-block mx-auto">

            <form action="index.html" method="GET">
                <div class="mb-3 mt-3">
                    <label for="idemail" class="form-label">Email:</label>
                    <input type="email" class="form-control" name="email" id="idemail" required>
                </div>

                <div class="mb-3">
                    <label for="idsenha" class="form-label">Senha:</label>
                    <input type="password" class="form-control" name="senha" id="idsenha" required>
                    <div class="form-text text-end text-white">Esqueci minha senha</div>
                </div>

                <button type="submit" class="btn btn-primary text-white w-100 border-0" style="background-color: var(--bs-success-bg-subtle);">
                    <strong>Entrar</strong>
                </button>
            </form>
        </div>
    </main>
</body>

</html>
